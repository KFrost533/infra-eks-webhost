apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fargate-control
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["list", "patch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["list", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fargate-control
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fargate-control
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: fargate-control
