name: Image Push

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: Target Amazon ECR repository
        type: string
        default: grafana-repo
      retrieval_from:
        description: Source registry
        type: string
        default: ghcr.io:grafana:latest
      target_tag:
        description: Target image tag
        type: string
        default: latest

jobs:
  image_push:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1
      - name: Pull image from source registry
        run: |
          docker pull ${{ github.event.inputs.retrieval_from }}
      - name: Tag image for target repository
        run: |
          docker tag ${{ github.event.inputs.retrieval_from }} ${{ github.event.inputs.target_repository }}:${{ github.event.inputs.target_tag }}
      - name: Push image to target repository
        run: |
          docker push ${{ github.event.inputs.target_repository }}:${{ github.event.inputs.target_tag }}