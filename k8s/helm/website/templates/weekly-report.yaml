{{- if .Values.weeklyReport.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-weekly-report
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  schedule: "0 9 * * 1"
  timeZone: "Asia/Tokyo"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1200
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Chart.Name }}
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          restartPolicy: Never
          containers:
            - name: weekly-report
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["node", "--import", "tsx", "backend/src/send-weekly-report.ts"]
              env:
                - name: ACCESS_MONGODB_URI
                  valueFrom:
                    secretKeyRef:
                      name: website-secrets
                      key: ACCESS_MONGODB_URI
                {{- range $key := list "REPORT_SMTP_HOST" "REPORT_SMTP_USER" "REPORT_SMTP_PASS" "REPORT_SMTP_FROM" "REPORT_TO" }}
                - name: {{ $key }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ $.Values.weeklyReport.secretName | quote }}
                      key: {{ $key }}
                {{- end }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
{{- end }}
