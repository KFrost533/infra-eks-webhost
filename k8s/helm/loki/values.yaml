loki:
  fullnameOverride: loki
  deploymentMode: Monolithic
  loki:
    auth_enabled: false
    image:
      registry: ""
      repository: infra-eks-webhost-loki
      tag: "3.7.10"
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    storage:
      type: s3
      bucketNames:
        chunks: ""
        ruler: ""
      s3:
        region: ap-southeast-2
  serviceAccount:
    create: true
    name: loki
    annotations:
      eks.amazonaws.com/role-arn: ""
  sidecar:
    rules:
      enabled: false
  singleBinary:
    replicas: 1
    sidecar: false
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
  gateway:
    enabled: false
  lokiCanary:
    enabled: false
  test:
    enabled: false
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  ingester:
    replicas: 0
  querier:
    replicas: 0
  queryFrontend:
    replicas: 0
  queryScheduler:
    replicas: 0
  distributor:
    replicas: 0
  compactor:
    replicas: 0
  indexGateway:
    replicas: 0
  bloomPlanner:
    replicas: 0
  bloomBuilder:
    replicas: 0
  bloomGateway:
    replicas: 0
