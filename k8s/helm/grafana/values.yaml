grafana:
  fullnameOverride: grafana
  image:
    registry: ""
    repository: infra-eks-webhost-grafana
    tag: "12.3.1"
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: false
  initChownData:
    enabled: false
  testFramework:
    enabled: false
  rbac:
    create: false
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Loki
          type: loki
          access: proxy
          url: http://loki:3100
          isDefault: true
          editable: false
